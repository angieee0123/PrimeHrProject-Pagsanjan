# Railway Project Configuration
# This file helps Railway understand your monorepo structure

[[services]]
name = "primehr-laravel"
source = "primeHrMagdalenaLaravel"

[services.build]
builder = "NIXPACKS"

[services.deploy]
startCommand = "php artisan migrate --force && php artisan optimize && php artisan serve --host=0.0.0.0 --port=$PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "gov-chatbot"
source = "GOVERNMENT CHATBOT/4. web application"

[services.build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[services.deploy]
startCommand = "python app_improved.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "hr-chatbot"  
source = "GOVERNMENT CHATBOT/4. web application"

[services.build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[services.deploy]
startCommand = "python chatbot_to_database.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
